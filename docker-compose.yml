
services:
  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: imobly-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/tests:/app/tests:rw
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - imobly-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: imobly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # Bind mounts do Windows/macOS não propagam eventos inotify para dentro
      # do container, então o hot reload do Next.js não dispara sozinho.
      # O polling resolve ao custo de um pouco de CPU — só vale em dev.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - imobly-network
    healthcheck:
      # `wget` e não `curl`: a imagem node:*-alpine não traz curl, então o
      # healthcheck anterior falhava sempre ("executable file not found") e o
      # container ficava permanentemente unhealthy mesmo servindo 200 OK.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      # O primeiro compile do `next dev` leva ~25s; margem para não marcar
      # unhealthy durante a inicialização normal.
      start_period: 90s

volumes:
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  imobly-network:
    driver: bridge
