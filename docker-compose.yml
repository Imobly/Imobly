
services:
  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: imobly-backend
    restart: unless-stopped
    ports:
      # `127.0.0.1:` explícito, não `"8000:8000"`.
      #
      # Sem host à esquerda, o Docker publica em AMBAS as pilhas —
      # `0.0.0.0:8000` E `[::]:8000` (`docker port` confirma as duas). No
      # Docker Desktop para Windows o lado IPv6 aceita a conexão TCP e trava
      # para sempre sem devolver um byte: `curl` resolve `localhost` para
      # `::1`, o handshake completa, e a requisição HTTP nunca recebe
      # resposta — sem erro, sem timeout de conexão, só silêncio indefinido.
      # Já `127.0.0.1` (IPv4) responde em ~20ms. Como a ordem de resolução de
      # `localhost` entre IPv6/IPv4 varia por processo, o mesmo endereço
      # funciona numa aba do navegador e trava noutra — sintoma relatado como
      # "a página não carrega de jeito nenhum", sem nada nos logs do container.
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/tests:/app/tests:rw
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - imobly-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: imobly-frontend
    restart: unless-stopped
    ports:
      # Mesmo motivo do backend: só IPv4. Sem isto o Next.js dev server
      # some por trás do listener IPv6 fantasma do Docker Desktop no Windows
      # — ver o comentário completo na porta do backend acima.
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # POLLING DESLIGADO POR PADRÃO.
      #
      # A ideia original era compensar bind mounts que não propagam inotify.
      # O efeito colateral, porém, é grave sobre o compartilhamento de arquivos
      # do Docker Desktop no Windows: o polling faz o Next.js varrer o
      # diretório repetidamente, a camada FUSE não dá conta e passa a devolver
      # `ENOMEM: not enough memory, scandir '/app/app'` — dezenas de vezes por
      # minuto, até o servidor parar de responder e o container ficar unhealthy.
      # Não é falta de memória: sobra RAM na VM e os limites de inotify estão
      # folgados; é a camada de arquivos saturando.
      #
      # Se o hot reload não disparar no seu ambiente, ligue com:
      #   WATCHPACK_POLLING=true docker compose up
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-false}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      # Volume NOMEADO, não anônimo.
      #
      # Um volume anônimo (`/app/.next`, sem nome) morre junto com o
      # container: todo `docker compose down` + `up` zera o cache de build do
      # Next.js, e o `next dev` precisa recompilar da estaca zero TODAS as
      # rotas no primeiro acesso de cada uma — em vez de segundos, cada rota
      # nova leva 10-30s+. É exatamente essa varredura pesada em disco,
      # multiplicada pelo número de rotas, que satura a camada de
      # compartilhamento de arquivos do Docker Desktop no Windows e produz os
      # picos de `ENOMEM: not enough memory, scandir '/app/app'` no cold
      # start (ver docker-compose.yml de antes desta mudança / commit
      # 60af187). Um volume nomeado sobrevive ao `down` e faz reinícios
      # seguintes carregarem o cache incremental do webpack.
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - imobly-network
    healthcheck:
      # `wget` e não `curl`: a imagem node:*-alpine não traz curl, então o
      # healthcheck anterior falhava sempre ("executable file not found") e o
      # container ficava permanentemente unhealthy mesmo servindo 200 OK.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      # O primeiro compile do `next dev` leva ~25s; margem para não marcar
      # unhealthy durante a inicialização normal.
      start_period: 90s

volumes:
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  frontend_next_cache:
    driver: local

networks:
  imobly-network:
    driver: bridge
