
services:
  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: imobly-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/tests:/app/tests:rw
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - imobly-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: imobly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # POLLING DESLIGADO POR PADRÃO.
      #
      # A ideia original era compensar bind mounts que não propagam inotify.
      # O efeito colateral, porém, é grave sobre o compartilhamento de arquivos
      # do Docker Desktop no Windows: o polling faz o Next.js varrer o
      # diretório repetidamente, a camada FUSE não dá conta e passa a devolver
      # `ENOMEM: not enough memory, scandir '/app/app'` — dezenas de vezes por
      # minuto, até o servidor parar de responder e o container ficar unhealthy.
      # Não é falta de memória: sobra RAM na VM e os limites de inotify estão
      # folgados; é a camada de arquivos saturando.
      #
      # Se o hot reload não disparar no seu ambiente, ligue com:
      #   WATCHPACK_POLLING=true docker compose up
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-false}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - imobly-network
    healthcheck:
      # `wget` e não `curl`: a imagem node:*-alpine não traz curl, então o
      # healthcheck anterior falhava sempre ("executable file not found") e o
      # container ficava permanentemente unhealthy mesmo servindo 200 OK.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      # O primeiro compile do `next dev` leva ~25s; margem para não marcar
      # unhealthy durante a inicialização normal.
      start_period: 90s

volumes:
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  imobly-network:
    driver: bridge
