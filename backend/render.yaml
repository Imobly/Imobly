services:
  - type: web
    name: imobly-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    # Migrations rodam ANTES do novo release receber tráfego. Se falharem, o
    # deploy é abortado e a versão anterior continua no ar.
    preDeployCommand: alembic upgrade head
    # O módulo é src.main — `app.main` não existe neste repositório.
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Configure manualmente no Render Dashboard
      # Conexão DIRETA (porta 5432) usada apenas pelas migrations — o pooler
      # do Supabase (6543, transaction pooling) não é adequado para DDL.
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false  # Segredo JWT do projeto Supabase (Settings → API)
      - key: SECRET_KEY
        sync: false  # Alias retrocompatível de SUPABASE_JWT_SECRET
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PROJECT_NAME
        value: Imóvel Gestão API
      - key: VERSION
        value: 1.0.0
      - key: API_V1_STR
        value: /api/v1
      - key: HOST
        value: 0.0.0.0
      - key: UPLOAD_DIR
        value: /tmp/uploads

# ⚠️ IMPORTANTE: Configure estas variáveis MANUALMENTE no Render Dashboard:
# 
# DATABASE_URL: postgresql://postgres.yyeldattafklyutbbnhu:[SUA_SENHA]@aws-0-us-west-2.pooler.supabase.com:5432/postgres
# 
# SECRET_KEY: DEVE SER A MESMA nos dois serviços (Backend + Auth-API)
# 1. Vá no Render Dashboard do Backend que já está rodando
# 2. Environment → Copie o valor da SECRET_KEY
# 3. Use essa MESMA chave no Auth-API
#
# Database hospedado no Supabase - não precisa criar no Render
