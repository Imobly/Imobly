# ============================================================
# Alembic — configuração de migrations do Imobly
# ------------------------------------------------------------
# A URL do banco NÃO é definida aqui. O `alembic/env.py` a lê de
# `src.config.settings.DATABASE_URL` (mesma resolução por ambiente
# usada pela aplicação), evitando um segundo lugar para configurar
# credenciais e o risco de apontar migrations para o banco errado.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Nome dos arquivos de revisão: 0001_descricao.py
file_template = %%(rev)s_%%(slug)s

# Fuso para timestamps gerados nos templates
timezone = America/Sao_Paulo

sqlalchemy.url =

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME

# ============================================================
# Logging
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
